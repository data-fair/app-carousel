<!DOCTYPE html>
<html><!-- no lang: set by the data-fair proxy -->
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <style>@layer vuetify-core, vuetify-components, vuetify-overrides, vuetify-utilities, vuetify-final;</style>
    <link href="/simple-directory/api/sites/_theme.css" rel="stylesheet">
    <script src="/simple-directory/api/sites/_public.js"></script>

    <title>Carousel</title><!-- template name: the proxy replaces it with the application title -->

    <!-- data-fair contract, read at runtime -->
    <meta name="df:vjsf" content="3">
    <meta name="df:filter-concepts" content="true">
    <meta name="df:sync-config" content="true">
    <meta name="df:sync-state" content="true">
    <meta name="df:overflow" content="true">
    <meta name="df:capture-delay" content="3">

    <!-- catalog, read on import (will move to registry) -->
    <meta name="application-name" content="app-carousel">
    <meta name="description" content="Diaporama ou bandeau défilant d'images, de photos ou de logos, depuis un jeu de données ou les pièces jointes de l'application.">

    <script>window.APPLICATION=%APPLICATION%;</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
